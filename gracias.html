<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gracias por tu mensaje</title>
  <meta http-equiv="refresh" content="6;url=https://cadereytaquality.com">
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f4f8;
      color: #333;
    }
    .mensaje {
      background: white;
      padding: 2rem 3rem;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .mensaje h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .mensaje p {
      margin-bottom: 1.5rem;
    }
    .boton {
      display: inline-block;
      padding: 10px 20px;
      background-color: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }
    .boton:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="mensaje">
    <h1>¡Gracias por contactarnos!</h1>
    <p>Tu mensaje ha sido enviado exitosamente. Serás redirigido al inicio en unos segundos...</p>
    <a class="boton" href="https://cadereytaquality.com">Volver ahora</a>
  </div>
</body>
</html>
